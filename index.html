<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale = 1.0" />
        <link rel = "stylesheet" href ="reset.css" />
        <link rel = "stylesheet" href = "style.css" />
    </head>
    <body>
        <div class = "fill"></div>
        <div class = "container">
            <form action="#" class="form form1">
                <div class ="form__item">
                    <h2 class="heading">Тариф:</h2>
                    <ul class = "switcher">
                        <li class = "switcher__item">
                            <input
                            type="radio"
                            name="tariff"
                            id="economy"
                            class="tariff"
                            value="economy"
                            />
                            <label for="economy">Эконом</label>
                        </li>
                        <li class = "switcher__item">
                            <input
                            type="radio"
                            name="tariff"
                            id="comfort"
                            class="tariff"
                            value="comfort"
                            checked="checked"
                            />
                            <label for="comfort">Комфорт</label>
                        </li>
                        <li class = "switcher__item">
                            <input
                            type="radio"
                            name="tariff"
                            id="business"
                            class="tariff"
                            value="business"
                            />
                            <label for="business">Бизнес</label>
                        </li>
                        <li class = "switcher__item">
                            <input
                            type="radio"
                            name="tariff"
                            id="premium"
                            class="tariff"
                            value="premium"
                            />
                            <label for="premium">Премиум</label>
                        </li>
                    </ul>
                </div>
                <div class ="form__item">
                    <h2 class="heading">Количество часов (минимум 2 часа)</h2>
                    <input
                    type="number"
                    name="time"
                    id="time"
                    min="2"
                    max="720"
                    value="2"
                    required
                    />
                </div>
                <div class="form__item">
                    <h2 class="heading">Дополнительные опции</h2>
                    <div>
                        <div class="option__item">
                            <input
                            type="checkbox"
                            name="option1"
                            id="option1"
                            class="option"
                            />
                            <label for="option1" class="checkmark"></label>
                            <label for="option1">Детское кресло с креплениями</label>
                        </div>
                        <div class="option__item">
                            <input
                            type="checkbox"
                            name="option2"
                            id="option2"
                            class="option"
                            />
                            <label for="option2" class="checkmark"></label>
                            <label for="option2">Дополнительная страховка</label>
                        </div>
                    </div>
                </div>
                <button type="button" id="calc">Рассчитать</button>
            </form>
            <form action="#" class="form form2">
                <div class="form__item">
                    <h2 class="heading">Итоговая стоимость поездки</h2>
                    <output class="total" id="total">0</output>
                </div>
            </form>
        </div>
        <script src = "app.js"></script>
    </body>
</html>
